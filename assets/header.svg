<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Giridhar — developer tools and open-source engineering</title>
  <desc id="desc">An animated developer portfolio hero with a terminal, moving network nodes, and glowing gradients.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816">
        <animate attributeName="stop-color" values="#050816;#09142a;#050816" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="0.52" stop-color="#0b1f35">
        <animate attributeName="stop-color" values="#0b1f35;#13264b;#0b1f35" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#11152d">
        <animate attributeName="stop-color" values="#11152d;#20164a;#11152d" dur="11s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.48" stop-color="#60a5fa" />
      <stop offset="1" stop-color="#c084fc" />
    </linearGradient>

    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.45" />
      <stop offset="1" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#93c5fd" stroke-opacity="0.08" stroke-width="1" />
    </pattern>

    <filter id="blur40" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="32" />
    </filter>

    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="frameClip">
      <rect x="0" y="0" width="1200" height="520" rx="34" />
    </clipPath>
  </defs>

  <style>
    .float-a { animation: floatA 7s ease-in-out infinite; }
    .float-b { animation: floatB 9s ease-in-out infinite; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; }
    .blink { animation: blink 1s steps(2, end) infinite; }
    .scan { animation: scan 5s linear infinite; }
    .dash { stroke-dasharray: 7 13; animation: dash 10s linear infinite; }
    .line-one { animation: lineOne 8s steps(1, end) infinite; }
    .line-two { animation: lineTwo 8s steps(1, end) infinite; }
    .line-three { animation: lineThree 8s steps(1, end) infinite; }

    @keyframes floatA {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-18px, 14px); }
    }
    @keyframes floatB {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(16px, -18px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: .5; transform: scale(.85); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan {
      0% { transform: translateY(-90px); opacity: 0; }
      12% { opacity: .6; }
      88% { opacity: .6; }
      100% { transform: translateY(250px); opacity: 0; }
    }
    @keyframes dash { to { stroke-dashoffset: -200; } }
    @keyframes lineOne {
      0%, 8% { opacity: 0; }
      9%, 100% { opacity: 1; }
    }
    @keyframes lineTwo {
      0%, 27% { opacity: 0; }
      28%, 100% { opacity: 1; }
    }
    @keyframes lineThree {
      0%, 49% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .float-a, .float-b, .pulse, .blink, .scan, .dash, .line-one, .line-two, .line-three { animation: none; }
    }
  </style>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="520" fill="url(#bg)" />
    <rect width="1200" height="520" fill="url(#grid)" />

    <circle class="float-a" cx="1070" cy="35" r="250" fill="url(#cyanGlow)" filter="url(#blur40)" />
    <circle class="float-b" cx="120" cy="510" r="250" fill="url(#violetGlow)" filter="url(#blur40)" />

    <path class="dash" d="M735 94C836 45 949 66 1086 156S1102 362 998 420" fill="none" stroke="url(#accent)" stroke-opacity="0.32" stroke-width="2" />
    <path class="dash" d="M785 444C845 366 919 329 1053 327" fill="none" stroke="#67e8f9" stroke-opacity="0.18" stroke-width="1.5" />

    <g opacity="0.85">
      <circle class="pulse" cx="772" cy="85" r="5" fill="#67e8f9" filter="url(#glow)" />
      <circle class="pulse" cx="944" cy="74" r="4" fill="#93c5fd" filter="url(#glow)" style="animation-delay:.6s" />
      <circle class="pulse" cx="1090" cy="166" r="6" fill="#c084fc" filter="url(#glow)" style="animation-delay:1.1s" />
      <circle class="pulse" cx="1053" cy="327" r="5" fill="#22d3ee" filter="url(#glow)" style="animation-delay:.2s" />
      <circle class="pulse" cx="998" cy="420" r="5" fill="#a78bfa" filter="url(#glow)" style="animation-delay:1.5s" />
      <circle class="pulse" cx="785" cy="444" r="4" fill="#60a5fa" filter="url(#glow)" style="animation-delay:.9s" />
    </g>

    <g opacity="0.22" stroke="#bfdbfe" fill="none">
      <path d="M852 120h164l49 49-49 49H852l-49-49z" />
      <path d="M890 148h89l27 21-27 21h-89l-27-21z" />
      <path d="M836 293h201l50 50-50 50H836l-50-50z" />
    </g>

    <g transform="translate(66 70)">
      <rect x="0" y="0" width="93" height="6" rx="3" fill="url(#accent)" />
      <text x="0" y="92" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="78" font-weight="750" letter-spacing="-2.5">Giridhar</text>
      <text x="3" y="139" fill="#bae6fd" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="600">I build practical tools and fix stubborn bugs.</text>
      <text x="3" y="183" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" letter-spacing="2">BROWSER INTERNALS  /  DEVELOPER TOOLING  /  OPEN SOURCE</text>

      <g transform="translate(2 226)">
        <rect width="560" height="168" rx="17" fill="#050a14" fill-opacity="0.88" stroke="#7dd3fc" stroke-opacity="0.24" />
        <rect x="0" y="0" width="560" height="35" rx="17" fill="#111827" />
        <rect x="0" y="18" width="560" height="17" fill="#111827" />
        <circle cx="20" cy="18" r="5" fill="#fb7185" />
        <circle cx="39" cy="18" r="5" fill="#fbbf24" />
        <circle cx="58" cy="18" r="5" fill="#4ade80" />
        <text x="216" y="23" fill="#64748b" font-family="Consolas, Menlo, monospace" font-size="12">giridhar@github:~</text>

        <rect class="scan" x="0" y="35" width="560" height="42" fill="url(#accent)" opacity="0.07" />

        <text class="line-one" x="22" y="67" fill="#67e8f9" font-family="Consolas, Menlo, monospace" font-size="15">$ inspect --problem real-world</text>
        <text class="line-two" x="22" y="101" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="15">✓ reproduced  ✓ isolated  ✓ measured</text>
        <text class="line-three" x="22" y="135" fill="#a7f3d0" font-family="Consolas, Menlo, monospace" font-size="15">→ shipping the smallest complete fix</text>
        <rect class="blink" x="376" y="121" width="9" height="18" fill="#a7f3d0" />
      </g>
    </g>

    <g transform="translate(748 232)">
      <rect width="372" height="118" rx="19" fill="#07111f" fill-opacity="0.76" stroke="#c4b5fd" stroke-opacity="0.25" />
      <text x="24" y="31" fill="#94a3b8" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="1.5">CURRENT SIGNAL</text>
      <text x="24" y="64" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="650">Build. Debug. Contribute.</text>
      <text x="24" y="91" fill="#7dd3fc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">TypeScript · Python · JavaScript · C</text>
      <circle class="pulse" cx="342" cy="29" r="5" fill="#4ade80" filter="url(#glow)" />
    </g>

    <g transform="translate(748 374)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600">
      <rect width="111" height="36" rx="18" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.35" />
      <text x="23" y="23" fill="#bae6fd">SYSTEMS</text>
      <rect x="122" width="116" height="36" rx="18" fill="#0f172a" stroke="#60a5fa" stroke-opacity="0.35" />
      <text x="145" y="23" fill="#bfdbfe">BROWSERS</text>
      <rect x="249" width="123" height="36" rx="18" fill="#0f172a" stroke="#c084fc" stroke-opacity="0.35" />
      <text x="270" y="23" fill="#ddd6fe">OPEN SOURCE</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="518" rx="33" fill="none" stroke="url(#accent)" stroke-opacity="0.34" stroke-width="2" />
</svg>
