<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Pavan G</title>
  <desc id="desc">Practical developer tools, browser internals, and open-source work.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.48" stop-color="#102a43" />
      <stop offset="1" stop-color="#1b3a57" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6ee7f9" stop-opacity="0.38" />
      <stop offset="1" stop-color="#6ee7f9" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#background)" />
  <circle cx="1025" cy="55" r="230" fill="url(#glow)" />
  <circle cx="110" cy="290" r="190" fill="url(#glow)" opacity="0.45" />

  <g opacity="0.18" stroke="#bae6fd" fill="none">
    <path d="M825 44h250l75 75-75 75H825l-75-75z" />
    <path d="M878 86h150l44 33-44 33H878l-44-33z" />
    <circle cx="750" cy="119" r="6" fill="#bae6fd" />
    <circle cx="1150" cy="119" r="6" fill="#bae6fd" />
  </g>

  <g opacity="0.2" fill="#dbeafe">
    <circle cx="73" cy="55" r="3" />
    <circle cx="106" cy="91" r="2" />
    <circle cx="1135" cy="244" r="3" />
    <circle cx="1090" cy="266" r="2" />
    <circle cx="956" cy="32" r="2" />
  </g>

  <rect x="78" y="68" width="116" height="5" rx="2.5" fill="url(#line)" />
  <text x="78" y="147" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-2">Pavan G</text>
  <text x="81" y="194" fill="#bae6fd" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="500">I build practical tools and fix stubborn bugs.</text>
  <text x="81" y="237" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" letter-spacing="1.2">BROWSER INTERNALS  ·  DEVELOPER TOOLING  ·  OPEN SOURCE</text>

  <path d="M78 263h410" stroke="url(#line)" stroke-width="3" stroke-linecap="round" />
  <circle cx="488" cy="263" r="6" fill="#a78bfa" filter="url(#softGlow)" />
